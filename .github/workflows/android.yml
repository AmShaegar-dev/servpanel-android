name: Android

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Собрать APK и опубликовать релиз'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Проверка Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Без пакета tools: его больше нет в репозитории SDK, и действие
          # падает с «Failed to find package 'tools'».
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Подготовить release-ключ
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SERVPANEL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SERVPANEL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SERVPANEL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SERVPANEL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            {
              echo "SERVPANEL_KEYSTORE=${RUNNER_TEMP}/release.jks"
              echo "SERVPANEL_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "SERVPANEL_KEY_ALIAS=${KEY_ALIAS}"
              echo "SERVPANEL_KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Подпись: release-ключ из Secrets"
          else
            echo "::warning::Секреты подписи не заданы — APK будет подписан debug-ключом"
          fi

      - name: Версия
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.4.5-dev.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode из тега: 1.2.0 -> 10200, чтобы обновления шли поверх
          # любой предыдущей сборки, а не зависели от номера запуска CI.
          if [[ "${VERSION_NAME}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          else
            VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Версия ${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Сборка release APK и lint
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintDebug --no-daemon --stacktrace \
            -PappVersionName="${APP_VERSION_NAME}" \
            -PappVersionCode="${APP_VERSION_CODE}"

      - name: Проверить подпись и упаковать
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          "${APKSIGNER}" verify --print-certs "${APK}"
          cp "${APK}" "dist/servpanel-mobile-${APP_VERSION_NAME}.apk"
          cp "${APK}" "dist/servpanel-mobile.apk"
          sha256sum dist/*.apk

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: servpanel-mobile-${{ env.APP_VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачать APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: servpanel-mobile-${{ needs.build.outputs.version }}
          path: dist

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          name: Servpanel Mobile ${{ needs.build.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: dist/*.apk
          body: |
            ## Установка

            1. Скачайте `servpanel-mobile.apk` ниже.
            2. Разрешите установку из неизвестных источников, если Android попросит.
            3. Откройте приложение и добавьте сервер панели Servpanel.

            Требуется Android 8.0 (API 26) или новее.

            **Важно:** обновления ставятся поверх предыдущей версии, только если
            APK подписан тем же ключом. Не удаляйте приложение между обновлениями —
            иначе список серверов будет потерян.

            Постоянная ссылка на последний APK:
            https://github.com/${{ github.repository }}/releases/latest/download/servpanel-mobile.apk
